[project]
name = "anime-list-api"
version = "1.0.0"
description = "Modular REST API optimized for managing anime catalogs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "uvicorn>=0.52.4",
    "python-jose[cryptography]>=3.5.0",
    "passlib[argon2]>=1.7.4",
]

[tool.ruff]
fix = true
line-length = 100
extend-exclude = [".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

